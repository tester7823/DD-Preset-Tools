name: apply-auto-detect
# one-time: apply auto-detect-patches.tar.xz (git format-patch) to this branch, remove these files, then build
on:
  push:
    branches: [ auto-detect ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: push
        run: |
          set -e
          git config user.name "tester7823"
          git config user.email "coin7097@gmail.com"
          if [ -f .github/workflows/auto-detect-patches.tar.xz ]; then
            mkdir -p /tmp/p && tar -xJf .github/workflows/auto-detect-patches.tar.xz -C /tmp/p
            git rm -q .github/workflows/auto-detect-patches.tar.xz .github/workflows/apply-auto-detect.yml
            git commit -q -m "Remove one-time upload files"
            git am /tmp/p/*.patch
            git push origin HEAD:auto-detect
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  windows:
    needs: apply
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - run: |
          bash ./fetch_deps.sh
          V=20241119
          curl -sSL -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/${V}/llvm-mingw-${V}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw" && tar -xf llvm-mingw.tar.xz -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          LLVM_MINGW="$RUNNER_TEMP/llvm-mingw" bash ./build.sh x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/x64/dd_preset_tools.dll
            build/x64/SDL2.dll
  macos:
    needs: apply
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
      - run: |
          brew install lld
          bash ./fetch_deps.sh
          export PATH="$(brew --prefix lld)/bin:$PATH"
          MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)" bash ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: |
            build/mac/dd_preset_tools.dylib
            build/mac/SDL2
